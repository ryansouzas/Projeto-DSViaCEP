<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSViaCEP</title>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="nav-container">
      <nav class="nav-main">
        <h1>DSViaCEP</h1>
        <div class="contact-link">contato</div>
      </nav>
    </header>

    <main>
      <section id="form-section">
        <div>
          <form name="newAddress">
            <div>
              <label for="cep">CEP:</label>
              <input name="cep" id="cep" placeholder="CEP" />
            </div>

            <div>
              <label for="street">Logradouro</label>
              <input name="street" id="street" placeholder="Logradouro" />
            </div>

            <div>
              <label for="number">Número: </label>
              <input name="number" id="number" placeholder="Número" />
            </div>

            <div>
              <label for="city">Cidade: </label>
              <input name="city" id="city" placeholder="Cidade" />
            </div>

            <div>
              <button type="submit">Salvar</button>
              <button type="reset">Limpar</button>
            </div>
          </form>
        </div>
      </section>

      <section id="list-section">
        <div>
          <h3>São Paulo</h3>
          <p>Av. Paulista, 1000 - Bela Vista, São Paulo - SP</p>
          <p>11200-000</p>
        </div>

        <div>
          <h3>São Paulo</h3>
          <p>Av. Paulista, 1000 - Bela Vista, São Paulo - SP</p>
          <p>11200-000</p>
        </div>
      </section>
    </main>
  </body>
</html>
